<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Cá Nhân - Hoạt Động 2</title>
    <link rel="stylesheet" href="PORTFOLIO.css">
</head>
<body>
    <!-- Cấu trúc tổng thể sử dụng Grid -->
    <div class="portfolio-layout">
        
        <header class="header">
            <h1>Portfolio Cá Nhân</h1>
        </header>

        <aside class="sidebar">
            <h2>Thông tin</h2>
            <p>Sinh viên Công nghệ Thông tin</p>
        </aside>

        <main class="main-content">
            <h2>Kỹ năng chuyên môn (Skills)</h2>
            <!-- Khu vực kỹ năng sử dụng Flexbox -->
            <div class="skills-container">
                <span class="skill-item">HTML5</span>
                <span class="skill-item">CSS3</span>
                <span class="skill-item">JavaScript</span>
                <span class="skill-item">Python</span>
                <span class="skill-item">SQL Server</span>
                <span class="skill-item">Figma</span>
            </div>
        </main>

        <footer class="footer">
            <p>© 2026 - Thiết kế bởi Phát</p>
        </footer>

    </div>
</body>
</html>
