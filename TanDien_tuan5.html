<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Bài Tập Về Nhà Tuần 5</title>
    
    <!-- Thư viện AOS cho hiệu ứng Scroll Reveal -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --dark: #1e1e2f;
            --light: #f3f4f6;
            --text-main: #1f2937;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--light);
            color: var(--text-main);
            overflow-x: hidden;
        }

        h2 {
            text-align: center;
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 40px;
        }

        /* BÀI 5: Hamburger Menu & Navbar */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(30, 30, 47, 0.7);
            backdrop-filter: blur(10px);
        }

        .logo { color: white; font-size: 1.5rem; font-weight: bold; }

        .hamburger {
            cursor: pointer;
            display: flex; flex-direction: column;
            justify-content: space-between;
            width: 35px; height: 24px;
        }

        .hamburger .line {
            width: 100%; height: 4px;
            background: white; border-radius: 4px;
            /* Dùng transform và opacity để chuyển động mượt, không dùng margin */
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.4s;
            transform-origin: center;
        }

        .hamburger.active .line:nth-child(1) { transform: translateY(10px) rotate(45deg); }
        .hamburger.active .line:nth-child(2) { opacity: 0; transform: scale(0.5); }
        .hamburger.active .line:nth-child(3) { transform: translateY(-10px) rotate(-45deg); }


        /* BÀI 4: Parallax Image (Banner) */
        .parallax-hero {
            height: 100vh;
            /* Ảnh nền cố định khi cuộn */
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1498050108023-c5249f4df085?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }


        /* BÀI 3: Typing Effect */
        .typing-container {
            background: rgba(0, 0, 0, 0.5);
            padding: 20px 40px;
            border-radius: 12px;
            border-left: 5px solid var(--secondary);
            backdrop-filter: blur(5px);
        }

        .typing-text {
            color: #50fa7b; /* Màu xanh lá code */
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.2rem;
            font-weight: bold;
            margin: 0;
            overflow: hidden;
            white-space: nowrap;
            border-right: 4px solid #50fa7b;
            /* Đếm đúng số ký tự của chuỗi để set độ rộng ch (khoảng 28 ký tự) */
            animation: typing 3.5s steps(28, end) forwards, blink-caret .75s step-end infinite;
            width: 0; /* Bắt đầu từ 0 */
        }

        @keyframes typing { to { width: 28ch; } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: #50fa7b; } }


        /* Layout Sections */
        .section-container { max-width: 1000px; margin: 80px auto; padding: 0 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }


        /* BÀI 2: Card Flip Effect (Thẻ nhân sự lật) */
        .flip-card {
            background-color: transparent;
            width: 100%; height: 320px;
            perspective: 1200px;
        }

        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .flip-card:hover .flip-card-inner {
            transform: rotateY(180deg); /* Hover lật thẻ */
        }

        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; /* Giấu mặt sau khi quay */
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .flip-card-front {
            background: white; border: 2px solid #e5e7eb;
        }
        .flip-card-front img {
            width: 100px; height: 100px; border-radius: 50%; background: var(--light); margin-bottom: 15px;
        }
        .flip-card-front h3 { margin: 0 0 5px 0; font-size: 1.8rem; }
        
        .flip-card-back {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; transform: rotateY(180deg);
        }
        .flip-card-back h3 { margin-bottom: 15px; font-size: 1.5rem; }
        .flip-card-back p { font-size: 1.1rem; margin: 5px 0; }


        /* BÀI 6: Skill Bar Animation */
        .skills-wrapper {
            background: white; padding: 40px; border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }
        .skill-item { margin-bottom: 25px; }
        .skill-header { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 10px; }
        .skill-bar-container {
            width: 100%; height: 16px; background-color: #e2e8f0;
            border-radius: 10px; overflow: hidden;
        }
        .skill-bar { height: 100%; border-radius: 10px; width: 0; }
        
        .html-bar {
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            animation: fillBarHTML 2s forwards cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.5s;
        }
        .css-bar {
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            animation: fillBarCSS 2s forwards cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.8s;
        }
        .js-bar {
            background: linear-gradient(90deg, #f6d365, #fda085);
            animation: fillBarJS 2s forwards cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.1s;
        }

        @keyframes fillBarHTML { to { width: 90%; } }
        @keyframes fillBarCSS { to { width: 85%; } }
        @keyframes fillBarJS { to { width: 75%; } }


        /* BÀI 1: Floating Action Button (FAB) */
        .fab {
            position: fixed;
            bottom: 40px; right: 40px;
            width: 65px; height: 65px;
            background: linear-gradient(135deg, var(--secondary), #f43f5e);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 28px;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.5);
            cursor: pointer; z-index: 1000;
            animation: pulse-fab 2s infinite; /* Keyframes phập phồng */
            transition: transform 0.3s;
        }
        
        .fab:hover {
            transform: scale(1.15);
            animation: none; /* Dừng chớp khi trỏ chuột */
        }

        @keyframes pulse-fab {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(236, 72, 153, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            .typing-text { font-size: 1.5rem; }
            @keyframes typing { to { width: 29ch; } } /* Cân chỉnh lại nhẹ cho mobile */
        }
    </style>
</head>
<body>

    <!-- Bài 5: Hamburger Menu (Nằm trong Navbar) & Bài 4: Parallax Banner -->
    <header class="parallax-hero">
        <nav class="navbar">
            <div class="logo">MyPortfolio</div>
            <div class="hamburger" id="hamburger-menu">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
        </nav>
        
        <!-- Bài 3: Typing Effect -->
        <div class="typing-container">
            <p class="typing-text">Tôi là một Web Developer...</p>
        </div>
    </header>

    <div class="section-container">
        <!-- Áp dụng Scroll Reveal AOS (Thuộc Yêu cầu nộp bài) -->
        <h2 data-aos="fade-up">About Me & Skills</h2>
        
        <div class="grid-2">
            <!-- Bài 2: Card Flip Effect -->
            <div class="flip-card" data-aos="fade-right" data-aos-delay="200">
                <div class="flip-card-inner">
                    <div class="flip-card-front">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Programmer" alt="Avatar">
                        <h3>Nguyễn Văn A</h3>
                        <p style="color: gray;">Lập trình viên Front-end</p>
                    </div>
                    <div class="flip-card-back">
                        <h3>Thông Tin Liên Hệ</h3>
                        <p>📧 email@example.com</p>
                        <p>📞 0987 654 321</p>
                        <p>🌐 github.com/nguyenvana</p>
                    </div>
                </div>
            </div>

            <!-- Bài 6: Skill Bar Animation -->
            <div class="skills-wrapper" data-aos="fade-left" data-aos-delay="400">
                <div class="skill-item">
                    <div class="skill-header"><span>HTML5</span><span>90%</span></div>
                    <div class="skill-bar-container">
                        <div class="skill-bar html-bar"></div>
                    </div>
                </div>
                <div class="skill-item">
                    <div class="skill-header"><span>CSS3 / Animations</span><span>85%</span></div>
                    <div class="skill-bar-container">
                        <div class="skill-bar css-bar"></div>
                    </div>
                </div>
                <div class="skill-item">
                    <div class="skill-header"><span>JavaScript</span><span>75%</span></div>
                    <div class="skill-bar-container">
                        <div class="skill-bar js-bar"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bài 1: Floating Action Button -->
    <div class="fab" title="Liên hệ">
        ✉
    </div>

    <!-- Script khởi tạo AOS (Scroll Reveal) -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Khởi tạo Scroll Reveal
        AOS.init({
            duration: 1000,
            once: true
        });

        // Script toggle menu hamburger
        const hamburger = document.getElementById('hamburger-menu');
        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
        });
    </script>
</body>
</html>
