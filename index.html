<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox & Grid Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Phần 1: Căn giữa bằng Flexbox -->
  <div class="flex-wrapper">
    
    <!-- Khối container được căn giữa -->
    <div class="container">
      <h2>Bố cục CSS Grid</h2>
      
      <!-- Phần 2: Bố cục Grid 3 cột -->
      <div class="grid-container">
        <div class="grid-item">Cột 1</div>
        <div class="grid-item">Cột 2</div>
        <div class="grid-item">Cột 3</div>
      </div>

    </div>
    
  </div>

</body>
</html>
