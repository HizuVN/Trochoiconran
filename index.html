<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex & Grid Battle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PHẦN 1: FLEXBOX BATTLE -->
    <!-- Sử dụng một wrapper có chiều cao 100vh để căn giữa container -->
    <div class="flex-wrapper">
        <div class="container">
            <h2>Hộp Nội Dung (Flexbox)</h2>
            <p>Tôi đang nằm chính giữa màn hình theo cả chiều dọc và ngang!</p>
        </div>
    </div>

    <!-- PHẦN 2: GRID BATTLE -->
    <div class="grid-section">
        <h2 style="text-align: center;">Bố cục lưới (CSS Grid)</h2>
        <div class="grid-container">
            <div class="grid-item">Cột 1</div>
            <div class="grid-item">Cột 2</div>
            <div class="grid-item">Cột 3</div>
        </div>
    </div>

</body>
</html>
