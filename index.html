<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Tuần 5 - Web Design</title>
    <style>
        /* ===== CÀI ĐẶT CHUNG ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f1f5f9; overflow-x: hidden; }
        
        /* ===== BÀI 5: HỆ THỐNG MENU HAMBURGER & HEADER ===== */
        header {
            position: fixed; top: 0; width: 100%; padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); z-index: 100;
        }
        .logo { font-size: 1.5rem; font-weight: bold; color: #06b6d4; letter-spacing: 2px;}
        
        .hamburger {
            width: 35px; height: 25px; display: flex; flex-direction: column;
            justify-content: space-between; cursor: pointer; z-index: 101;
        }
        .hamburger span {
            display: block; height: 3px; width: 100%; background-color: #06b6d4;
            border-radius: 3px; transition: transform 0.4s ease, opacity 0.4s ease;
        }
        /* Hiệu ứng biến thành dấu X */
        .hamburger.active span:nth-child(1) { transform: translateY(11px) rotate(45deg); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: translateY(-11px) rotate(-45deg); }

        /* ===== BÀI 4 & BÀI 3: PARALLAX BACKGROUND & TYPING EFFECT ===== */
        .parallax-hero {
            height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            /* Ảnh nền cố định tạo không gian 3D */
            background-image: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.9)), 
                              url('https://images.unsplash.com/photo-1555066931-4365d14bab8c?q=80&w=1920');
            background-attachment: fixed;
            background-position: center;
            background-size: cover;
        }
        .typing-container { display: inline-block; }
        .typing-text {
            font-size: 2.5rem; color: #38bdf8;
            white-space: nowrap; overflow: hidden;
            border-right: 4px solid #38bdf8; width: 0;
            /* Gọi 2 keyframes đồng thời */
            animation: typing 3.5s steps(30) forwards, blink 0.6s step-end infinite alternate;
        }
        @keyframes typing { from { width: 0; } to { width: 100%; } }
        @keyframes blink { 50% { border-color: transparent; } }

        /* ===== PHẦN NỘI DUNG CHÍNH ===== */
        .content-section {
            padding: 100px 20px; max-width: 1000px; margin: 0 auto;
            display: flex; flex-wrap: wrap; gap: 50px; justify-content: center;
        }

        /* ===== BÀI 2: CARD FLIP EFFECT ===== */
        .card-container { width: 300px; height: 400px; perspective: 1200px; }
        .card {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .card-container:hover .card { transform: rotateY(180deg); }
        .card-front, .card-back {
            width: 100%; height: 100%; position: absolute;
            top: 0; left: 0; backface-visibility: hidden;
            border-radius: 16px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(6, 182, 212, 0.3);
        }
        .card-front { background: #1e293b; }
        .card-front img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #06b6d4; margin-bottom: 20px; object-fit: cover; }
        .card-front h3 { color: #f8fafc; font-size: 1.5rem; }
        .card-front p { color: #94a3b8; margin-top: 5px; }
        
        .card-back { background: #06b6d4; color: #0f172a; transform: rotateY(180deg); padding: 20px; }
        .card-back h3 { font-size: 1.8rem; margin-bottom: 20px; }
        .social-links a {
            display: inline-block; padding: 10px 20px; margin: 5px;
            background: #0f172a; color: #06b6d4; text-decoration: none;
            border-radius: 8px; font-weight: bold; transition: 0.3s;
        }
        .social-links a:hover { background: #f8fafc; color: #0f172a; }

        /* ===== BÀI 6: SKILL BAR ANIMATION ===== */
        .skills-container { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 20px; justify-content: center; }
        .skill-item h4 { margin-bottom: 8px; color: #e2e8f0; font-weight: 500; }
        .skill-bg {
            width: 100%; height: 12px; background-color: #334155;
            border-radius: 20px; overflow: hidden;
        }
        .skill-bar {
            height: 100%; width: 0; border-radius: 20px;
            background: linear-gradient(90deg, #06b6d4, #3b82f6);
            /* Thuộc tính forwards giữ thanh nằm ở điểm đích */
            animation: fillBar 2.5s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
            animation-delay: 0.5s; /* Chờ 1 chút trước khi chạy */
        }
        @keyframes fillBar {
            0% { width: 0; }
            100% { width: var(--target); }
        }

        /* ===== BÀI 1: FLOATING ACTION BUTTON (FAB) ===== */
        .fab {
            position: fixed; bottom: 40px; right: 40px;
            width: 65px; height: 65px; border-radius: 50%;
            background: linear-gradient(135deg, #ec4899, #8b5cf6); /* Màu Messenger style */
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; text-decoration: none;
            z-index: 999;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.7); }
            50% { transform: scale(1.15); box-shadow: 0 0 0 20px rgba(236, 72, 153, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
        }
    </style>
</head>
<body>

    <!-- BÀI 5: HAMBURGER MENU -->
    <header>
        <div class="logo">PORTFOLIO</div>
        <div class="hamburger" onclick="this.classList.toggle('active')">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <!-- BÀI 4 & 3: PARALLAX & TYPING -->
    <section class="parallax-hero">
        <div class="typing-container">
            <h2 class="typing-text">Xin chào, tôi là Web Developer_</h2>
        </div>
    </section>

    <section class="content-section">
        <!-- BÀI 2: CARD FLIP -->
        <div class="card-container">
            <div class="card">
                <div class="card-front">
                    <!-- Ảnh đại diện -->
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=200" alt="Avatar">
                    <h3>Phát</h3>
                    <p>Front-end Developer</p>
                </div>
                <div class="card-back">
                    <h3>Kết Nối</h3>
                    <div class="social-links">
                        <a href="#">Facebook</a>
                        <a href="#">GitHub</a>
                        <a href="#">LinkedIn</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- BÀI 6: SKILL BAR -->
        <div class="skills-container">
            <div class="skill-item">
                <h4>HTML5 / CSS3</h4>
                <div class="skill-bg">
                    <div class="skill-bar" style="--target: 95%;"></div>
                </div>
            </div>
            <div class="skill-item">
                <h4>JavaScript</h4>
                <div class="skill-bg">
                    <div class="skill-bar" style="--target: 80%;"></div>
                </div>
            </div>
            <div class="skill-item">
                <h4>UI/UX Design</h4>
                <div class="skill-bg">
                    <div class="skill-bar" style="--target: 85%;"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- BÀI 1: FAB -->
    <a href="#" class="fab">MSG</a>

</body>
</html>
