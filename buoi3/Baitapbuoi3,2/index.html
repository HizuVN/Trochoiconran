<!DOCTYPE html>
<html lang="vi">
<head>

    <title>Portfolio Cá Nhân</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-container">
        <header class="header">
            <h1>Portfolio Cá Nhân</h1>

            <p>Xin chào, tôi là một lập trình viên. Đây là phần sidebar.</p>
        </aside>
        
        <main class="main-content">
            <section class="skills-section">
                <h2>Kỹ năng (Skills)</h2>
                <div class="skills">
                    <span class="skill-item">HTML5</span>
                    <span class="skill-item">CSS3</span>
                    <span class="skill-item">JavaScript</span>
                    <span class="skill-item">ReactJS</span>
                    <span class="skill-item">Node.js</span>
                    <span class="skill-item">Python</span>
                    <span class="skill-item">Git</span>
                </div>
            </section>
        </main>
        
        <footer class="footer">
            <p>&copy; 2026 Bản quyền thuộc về Portfolio Cá Nhân</p>
        </footer>
    </div>
</body>
</html>
