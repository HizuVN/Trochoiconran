<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoạt Động 1: Flex & Grid Battle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- FLEXBOX: Căn giữa theo chiều dọc và ngang -->
    <div class="container">
        <div class="box">
            Nội dung căn giữa (Flexbox)
        </div>
    </div>

    <!-- GRID: Bố cục lưới 3 cột -->
    <div class="grid-container">
        <div>Cột 1</div>
        <div>Cột 2</div>
        <div>Cột 3</div>
    </div>

</body>
</html>
